[project]
name = "ajents"
version = "0.1"
description = "RL agents in JAX"
authors = [{ name = "Onno Eberhard", email = "onnoeberhard@gmail.com" }]
requires-python = ">=3.9"
dependencies = [
    "tqdm",
    "jax",
    "jaxlib",
    "optax",
    "rich",
    "flax",
    "distrax",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

